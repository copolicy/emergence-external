<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Signal seed strip</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #e9e9e4;
        font: 13px/1.2 -apple-system, sans-serif;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      figure {
        margin: 0;
        background: #f5f5f2;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
      }
      /* A fixed guide ring at the hero's target radius — if the hero breathes
         with the seed, it will drift off this circle. */
      .guide {
        position: absolute;
        border: 1px solid rgba(200, 40, 40, 0.55);
        border-radius: 50%;
        pointer-events: none;
      }
      figcaption {
        text-align: center;
        padding: 3px 0 6px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script type="module">
      import {
        computeSignal,
        drawSignal,
        DEFAULT_SIGNAL,
        INK,
        BG,
      } from "/src/tools/signalCore.ts";
      import { stampOptsForStroke } from "/src/tools/stampTreatment.ts";

      const W = 1080;
      const PX = 340;
      const grid = document.getElementById("grid");

      for (const seed of [1, 5, 12, 20, 28, 37, 44, 60]) {
        const fig = document.createElement("figure");
        const canvas = document.createElement("canvas");
        canvas.width = PX;
        canvas.height = PX;
        const cap = document.createElement("figcaption");
        cap.textContent = "seed " + seed;
        fig.append(canvas, cap);
        grid.append(fig);

        const params = { ...DEFAULT_SIGNAL, seed };
        const lines = computeSignal(W, W, params);
        drawSignal(
          canvas.getContext("2d"),
          PX / W,
          W,
          W,
          lines,
          INK,
          BG,
          1,
          true,
          seed,
          stampOptsForStroke(params),
        );

        // Guide ring at the hero's centroid, radius 0.36 of the frame, painted
        // into the canvas so it shares the art's coordinate space exactly.
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const l of lines.filter((l) => l.family === 4)) {
          for (let i = 0; i < l.pts.length; i += 2) {
            minX = Math.min(minX, l.pts[i]);
            maxX = Math.max(maxX, l.pts[i]);
            minY = Math.min(minY, l.pts[i + 1]);
            maxY = Math.max(maxY, l.pts[i + 1]);
          }
        }
        const s = PX / W;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.beginPath();
        ctx.arc(
          ((minX + maxX) / 2) * s,
          ((minY + maxY) / 2) * s,
          0.36 * W * s,
          0,
          Math.PI * 2,
        );
        ctx.strokeStyle = "rgba(200,40,40,0.6)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      document.title = "ready";
    </script>
  </body>
</html>
